# ===================================================================
# 1. Tï¿½N ?NG D?NG & SERVER
# ===================================================================
spring.application.name=Smart_Attendance_Enterprise_LMS
server.port=8080

# ===================================================================
# 2. C? S? D? LI?U POSTGRESQL + PGVECTOR
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/lms_db?useUnicode=true&characterEncoding=UTF8}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1}
spring.datasource.driver-class-name=org.postgresql.Driver

## HTTP & Servlet Encoding (B?T BU?C UTF-8 CHO TI?NG VI?T)
#server.servlet.encoding.charset=UTF-8
#server.servlet.encoding.enabled=true
#server.servlet.encoding.force=true
#spring.http.encoding.charset=UTF-8
#spring.http.encoding.enabled=true
#spring.http.encoding.force=true

# JPA / Hibernate Config
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 3. K?T N?I REDIS (L?u Refresh Token, Quiz Cache)
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6380
# spring.data.redis.password= # Thï¿½m m?t kh?u n?u Redis c?a b?n yï¿½u c?u

# ===================================================================
# 4. B?O M?T JWT & REFRESH TOKEN
# ===================================================================
jwt.secret=${JWT_SECRET:9a2f8c4e7b1a6d3e5f8c2b4a7d1e9f3a6b8c2d4e7f1a3b5c8d2e4f6a9b1c3d5e}

# Access Token (15 phï¿½t = 900,000 ms)
jwt.access-token-expiration=900000

# Refresh Token (7 ngï¿½y = 604,800,000 ms)
jwt.refresh-token-expiration=604800000

# Verify Email Token (24 gi? = 86,400,000 ms)
jwt.verify-expiration=86400000

# ===================================================================
# 5. GI?I H?N DUNG L??NG UPLOAD FILE (T?i ?nh ?i?m danh, Video LMS)
# ===================================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===================================================================
# 6. L?U TR? MEDIA MINIO / AWS S3
